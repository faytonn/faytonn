<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="150" viewBox="0 0 1280 150" role="img" aria-label="Quod aedifico manet: what I build, endures"><title>Quod aedifico manet: what I build, endures</title><style>
@keyframes fly{from{opacity:0;transform:translate(var(--x,0px),var(--y,0px)) rotate(var(--r,0deg)) scale(var(--s,1))}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes fade{from{opacity:0}}
@keyframes draw{from{stroke-dashoffset:var(--len)}}
@keyframes float{50%{transform:translateY(-8px) rotate(6deg)}}
@keyframes sway{0%,100%{transform:rotate(0deg)}30%{transform:rotate(.7deg) skewY(.2deg)}65%{transform:rotate(-.5deg)}}
.pc{transform-box:fill-box;transform-origin:center;animation:fly 1s cubic-bezier(.2,.9,.25,1.15) backwards;animation-delay:var(--d,0s)}
.rise{animation:rise .9s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:var(--d,0s)}
.fade{animation:fade 1s ease backwards;animation-delay:var(--d,0s)}
.draw{stroke-dasharray:var(--len);animation:draw 1.1s ease-in-out backwards;animation-delay:var(--d,0s)}
.spark{transform-box:fill-box;transform-origin:center;animation:float 6s ease-in-out infinite;animation-delay:var(--d,0s)}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
